name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.backend }} (Py-${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        backend: ["tensorflow", "torch", "jax"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install base dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install "keras>=3.0.0" pytest build
          pip install .

      - name: Install backend (${{ matrix.backend }})
        run: |
          if [ "${{ matrix.backend }}" = "tensorflow" ]; then
            pip install tensorflow-cpu
          elif [ "${{ matrix.backend }}" = "torch" ]; then
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          elif [ "${{ matrix.backend }}" = "jax" ]; then
            pip install "jax[cpu]"
          fi

      - name: Run Smoke Tests (Shape Verification)
        env:
          KERAS_BACKEND: ${{ matrix.backend }}
        run: |
          pytest -m smoke -v

      - name: Run Training Tests (Gradient & Loss Verification)
        env:
          KERAS_BACKEND: ${{ matrix.backend }}
        run: |
          pytest -m training -v

